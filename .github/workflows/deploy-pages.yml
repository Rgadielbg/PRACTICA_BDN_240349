name: Publicar documentación en GitHub Pages

on:
  push:
    branches:
      - Practica03
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar el sitio
        run: |
          mkdir -p _site/Docs _site/archify _site/diccionario
          cp Practica03/Docs/index.html _site/Docs/index.html
          cp Practica03/archify/modelo_eer_respaldo7.html _site/archify/modelo_eer_respaldo7.html
          cp Practica03/diccionario/index.html _site/diccionario/index.html
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./Docs/">
            <title>Documentación de la base de datos</title>
          </head>
          <body><p>Abriendo la <a href="./Docs/">documentación de la base de datos</a>…</p></body>
          </html>
          EOF

      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
